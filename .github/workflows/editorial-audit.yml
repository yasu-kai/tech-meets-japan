name: Editorial Audit

on:
  push:
    branches: [main]
    paths:
      - "lib/data.ts"
      - "lib/productCatalog.ts"
      - "lib/editorialAudit.ts"
      - "scripts/editorial-audit.mjs"
      - "app/products/**"
  pull_request:
    paths:
      - "lib/data.ts"
      - "lib/productCatalog.ts"
      - "lib/editorialAudit.ts"
      - "scripts/editorial-audit.mjs"
      - "app/products/**"
  workflow_dispatch:

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:editorial